name: Playwright tests

on: workflow_dispatch

jobs:
  tests:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: npm ci

      - name: Run test1
        run: npm test -- test1 > test1.txt || true
        
      - name: Run test2
        run: npm test -- test2 > test2.txt

      - name: Commit test results
        run: |
          git config --global user.name 'tonipekkala24'
          git config --global user.email 'tpekkala24@students.oamk.fi'
          git add .
          git commit -m 'update'
          git push

      - name: Test failed
        if: failure()
        run: echo "Tests failed"
